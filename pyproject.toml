[project]
name = "funmaterial"
version = "1.0.26"
description = "素材获取工具库，从 Zenodo、Pexels、Pixabay、Unsplash 拉取视频、背景音乐、字体等素材"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [ "farlog>=1.1.7", "fundrive>=2.0.86", "funfake>=1.0.6", "funget>=1.1.63", "funsecret>=1.4.84", "moviepy>=2.0.0", "pillow>=11.3.0", "pydantic>=2.0.0", "requests>=2.32.0",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=8.0.0",]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
